name: investment-radar
services:
  db:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_DB: investment_radar
      POSTGRES_USER: radar_owner
      POSTGRES_PASSWORD: ${IR_DB_PASSWORD:?secret missing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U radar_owner -d investment_radar"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  api:
    build: .
    restart: unless-stopped
    environment: &runtime
      DATABASE_URL: postgresql://radar_app:${IR_APP_PASSWORD:?secret missing}@db:5432/investment_radar
      RADAR_API_KEY: ${IR_API_KEY:?secret missing}
      RADAR_READ_KEY: ${IR_READ_KEY:?secret missing}
      NODE_ENV: production
    ports: ["127.0.0.1:17845:3000"]
    networks: [backend, egress]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *logging
  migrate:
    build: .
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://radar_owner:${IR_DB_PASSWORD:?secret missing}@db:5432/investment_radar
      IR_APP_PASSWORD: ${IR_APP_PASSWORD:?secret missing}
    networks: [backend]
    command: [node, dist/migrate.js]
    depends_on:
      db: { condition: service_healthy }
  worker:
    build: .
    profiles: [tools]
    environment: *runtime
    networks: [backend, egress]
    command: [node, dist/worker.js]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
networks:
  backend: { internal: true }
  egress: {}
volumes:
  postgres_data: {}
